<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nampan — Selamatkan Makanan, Selamatkan Bumi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A22;
    --ink-soft:#5C6B5E;
    --leaf:#1F5F4A;
    --leaf-2:#163F31;
    --leaf-light:#4C8B72;
    --turmeric:#E09A2E;
    --turmeric-deep:#B67A1E;
    --sambal:#BE4A3C;
    --rice:#FFFFFF;
    --sage:#EAF1EC;
    --sage-line:#DCE6DE;
    --white:#FFFFFF;
    --radius-tray:28px 28px 10px 10px;
    --shadow-card:0 1px 2px rgba(20,40,32,.06), 0 8px 20px -12px rgba(20,40,32,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Public Sans',sans-serif;
    background:var(--rice);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Bricolage Grotesque',sans-serif; }
  .mono{ font-family:'Space Mono',monospace; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; }
  a{ color:inherit; }
  ::selection{ background:var(--turmeric); color:var(--ink); }

  /* ---------- App shell ---------- */
  #app{ min-height:100vh; }
  .shell{ display:flex; min-height:100vh; }
  .sidebar{
    width:230px; flex-shrink:0; background:var(--leaf);
    color:var(--rice); padding:28px 18px; display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:36px; padding:0 6px; }
  .brand svg{ width:34px; height:34px; }
  .brand-name{ font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:22px; letter-spacing:.2px; }
  .brand-tag{ font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:var(--turmeric); margin-top:-2px; }
  .nav-list{ display:flex; flex-direction:column; gap:4px; flex:1; }
  .nav-item{
    display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:12px;
    background:transparent; border:none; color:rgba(250,246,236,.72); text-align:left;
    font-size:14.5px; font-weight:500; transition:background .15s, color .15s; position:relative;
  }
  .nav-item svg{ width:19px; height:19px; flex-shrink:0; }
  .nav-item.active{ background:rgba(76,139,114,.38); color:var(--rice); }
  .nav-item.active::before{
    content:''; position:absolute; left:-18px; top:50%; transform:translateY(-50%);
    width:4px; height:20px; background:var(--turmeric); border-radius:0 4px 4px 0;
  }
  .nav-item:hover{ background:rgba(76,139,114,.22); color:var(--rice); }
  .nav-badge{
    margin-left:auto; background:var(--turmeric); color:var(--ink); font-size:11px; font-weight:700;
    padding:1px 7px; border-radius:99px;
  }
  .sidebar-foot{ font-size:11.5px; color:rgba(250,246,236,.45); padding:10px 6px 0; border-top:1px solid rgba(250,246,236,.14); margin-top:12px; }
  .logout-btn{ background:transparent; border:1px solid rgba(250,246,236,.25); color:rgba(250,246,236,.8); border-radius:10px; padding:9px 12px; font-size:13px; margin-top:14px; }
  .logout-btn:hover{ border-color:var(--turmeric); color:var(--turmeric); }

  .main{ flex:1; min-width:0; padding:30px 40px 100px; max-width:1200px; }
  .topbar-mobile{ display:none; }

  /* ---------- Bottom nav (mobile) ---------- */
  .bottom-nav{
    display:none; position:fixed; bottom:0; left:0; right:0; background:var(--leaf);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom)); z-index:50;
    box-shadow:0 -4px 18px rgba(0,0,0,.18);
  }
  .bottom-nav-inner{ display:flex; justify-content:space-around; }
  .bnav-item{ background:none; border:none; color:rgba(250,246,236,.6); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:600; padding:4px 10px; border-radius:10px; position:relative; }
  .bnav-item svg{ width:20px; height:20px; }
  .bnav-item.active{ color:var(--turmeric); }
  .bnav-dot{ position:absolute; top:0; right:6px; width:7px; height:7px; border-radius:50%; background:var(--sambal); border:1.5px solid var(--leaf); }

  /* ---------- Role select ---------- */
  .role-screen{ position:relative; overflow:hidden; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; background:var(--leaf); }
  .slide-bg-layer{ position:absolute; inset:0; background-size:cover; background-position:center; opacity:0; transition:opacity 1.8s ease; z-index:0; }
  .slide-bg-layer.active{ opacity:1; }
  .role-overlay{ position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, rgba(22,63,49,.90) 0%, rgba(15,42,33,.94) 100%); }
  .role-content{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; width:100%; }
  .role-brand{ display:flex; align-items:center; gap:14px; margin-bottom:10px; }
  .role-brand svg{ width:56px; height:56px; }
  .role-title{ color:var(--rice); font-size:44px; font-weight:600; margin:0; }
  .role-sub{ color:rgba(250,246,236,.75); font-size:15px; max-width:480px; text-align:center; margin:10px 0 42px; line-height:1.6; }
  .role-cards{ display:flex; gap:22px; width:100%; max-width:760px; }
  .role-card{
    flex:1; background:var(--rice); border-radius:24px; padding:32px 26px; text-align:left;
    border:none; cursor:pointer; transition:transform .18s ease, box-shadow .18s ease;
    display:flex; flex-direction:column; gap:14px; box-shadow:0 20px 40px -20px rgba(0,0,0,.5);
  }
  .role-card:hover{ transform:translateY(-6px); }
  .role-card .icon-wrap{ width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; }
  .role-card.buyer .icon-wrap{ background:var(--sage); }
  .role-card.supplier .icon-wrap{ background:#F0E4BE; }
  .role-card svg{ width:26px; height:26px; color:var(--leaf); }
  .role-card h3{ margin:0; font-size:22px; }
  .role-card p{ margin:0; font-size:13.5px; color:var(--ink-soft); line-height:1.55; }
  .role-card .go{ font-size:13px; font-weight:700; color:var(--leaf); display:flex; align-items:center; gap:6px; margin-top:6px; }
  @media (max-width:640px){ .role-cards{ flex-direction:column; } .role-title{ font-size:34px; } }

  /* ---------- Page header ---------- */
  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .page-head h1{ font-size:28px; margin:0 0 4px; }
  .page-head .sub{ color:var(--ink-soft); font-size:13.5px; }
  .eyebrow{ text-transform:uppercase; letter-spacing:1.5px; font-size:11px; font-weight:700; color:var(--leaf-2); margin-bottom:6px; }

  /* ---------- Search / filters ---------- */
  .filter-bar{ display:flex; gap:10px; flex-wrap:wrap; background:var(--white); border:1px solid var(--sage-line); border-radius:18px; padding:14px; margin-bottom:22px; }
  .filter-field{ flex:1; min-width:150px; display:flex; flex-direction:column; gap:5px; }
  .filter-field label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); }
  .filter-field input, .filter-field select{
    border:1px solid var(--sage-line); border-radius:10px; padding:9px 11px; font-size:13.5px; background:var(--rice); color:var(--ink);
  }
  .filter-field input:focus, .filter-field select:focus{ outline:2px solid var(--turmeric); outline-offset:1px; }
  .search-btn{
    align-self:flex-end; background:var(--leaf); color:var(--rice); border:none; border-radius:10px;
    width:42px; height:42px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .search-btn:hover{ background:var(--leaf-2); }
  .cat-toggle{ display:flex; gap:6px; }
  .cat-toggle button{ border:1px solid var(--sage-line); background:var(--rice); border-radius:10px; padding:9px 12px; font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .cat-toggle button.active{ background:var(--leaf); color:var(--rice); border-color:var(--leaf); }

  /* ---------- Product grid ---------- */
  .product-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  @media (max-width:900px){ .product-grid{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:640px){ .product-grid{ grid-template-columns:repeat(2,1fr); gap:10px; } }
  .p-card{ background:var(--white); border-radius:18px; overflow:hidden; box-shadow:var(--shadow-card); border:1px solid var(--sage-line); cursor:pointer; display:flex; flex-direction:column; text-align:left; padding:0; }
  .p-card:hover{ box-shadow:0 4px 8px rgba(27,27,22,.08), 0 14px 30px -14px rgba(27,27,22,.28); }
  .p-thumb{ position:relative; aspect-ratio:4/3; width:100%; background:linear-gradient(135deg,var(--sage),#D9EAE0); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .p-thumb img{ width:100%; height:100%; object-fit:cover; }
  .p-thumb .emoji{ font-size:34px; opacity:.65; }
  .p-cat-pill{ position:absolute; top:8px; left:8px; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; padding:3px 8px; border-radius:99px; }
  .p-cat-pill.k{ background:var(--sage); color:var(--leaf); }
  .p-cat-pill.n{ background:#F0E4BE; color:#8A6A12; }
  .freshbar{ position:absolute; bottom:0; left:0; right:0; height:4px; }
  .freshbar.fresh{ background:var(--leaf-light); }
  .freshbar.soon{ background:var(--turmeric); }
  .freshbar.urgent{ background:var(--sambal); }
  .p-body{ padding:11px 12px 13px; display:flex; flex-direction:column; gap:5px; flex:1; }
  .p-name{ font-size:13.5px; font-weight:700; line-height:1.3; min-height:35px; }
  .p-price{ font-family:'Space Mono',monospace; font-weight:600; font-size:14px; color:var(--leaf-2); }
  .p-meta{ font-size:11px; color:var(--ink-soft); display:flex; align-items:center; gap:4px; }
  .p-exp{ font-size:10.5px; font-weight:600; margin-top:auto; padding-top:4px; }
  .p-exp.urgent{ color:var(--sambal); }
  .p-exp.soon{ color:var(--turmeric-deep); }
  .p-exp.fresh{ color:var(--leaf-2); }
  .empty-note{ padding:50px 20px; text-align:center; color:var(--ink-soft); font-size:14px; }

  /* ---------- Buttons ---------- */
  .btn{ border:none; border-radius:12px; padding:12px 18px; font-size:14px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn-primary{ background:var(--leaf); color:var(--rice); }
  .btn-primary:hover{ background:var(--leaf-2); }
  .btn-turmeric{ background:var(--turmeric); color:var(--ink); }
  .btn-turmeric:hover{ background:var(--turmeric-deep); }
  .btn-ghost{ background:transparent; color:var(--leaf); border:1.5px solid var(--sage-line); }
  .btn-ghost:hover{ border-color:var(--leaf); }
  .btn-block{ width:100%; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .back-link{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--ink-soft); background:none; border:none; margin-bottom:16px; padding:0; }
  .back-link svg{ width:16px; height:16px; }
  .back-link:hover{ color:var(--leaf); }

  /* ---------- Detail screen ---------- */
  .detail-wrap{ display:grid; grid-template-columns:1.1fr 1fr; gap:32px; }
  @media (max-width:800px){ .detail-wrap{ grid-template-columns:1fr; } }
  .detail-img{ aspect-ratio:1/1; border-radius:var(--radius-tray); background:linear-gradient(135deg,var(--sage),#D9EAE0); display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:var(--shadow-card); }
  .detail-img img{ width:100%; height:100%; object-fit:cover; }
  .detail-img .emoji{ font-size:88px; opacity:.6; }
  .detail-panel h1{ font-size:26px; margin:0 0 8px; }
  .detail-price{ font-family:'Space Mono',monospace; font-size:24px; font-weight:600; color:var(--leaf-2); margin-bottom:14px; }
  .detail-tags{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .tag{ font-size:11px; font-weight:600; background:var(--sage); color:var(--leaf-2); padding:4px 10px; border-radius:99px; }
  .detail-desc{ font-size:14px; line-height:1.65; color:var(--ink-soft); margin-bottom:18px; }
  .detail-facts{ background:var(--white); border:1px solid var(--sage-line); border-radius:16px; padding:16px; margin-bottom:20px; display:flex; flex-direction:column; gap:10px; }
  .fact-row{ display:flex; justify-content:space-between; font-size:13.5px; }
  .fact-row span:first-child{ color:var(--ink-soft); }
  .fact-row span:last-child{ font-weight:700; }
  .fact-row.urgent span:last-child{ color:var(--sambal); }

  /* ---------- Forms ---------- */
  .form-card{ background:var(--white); border:1px solid var(--sage-line); border-radius:20px; padding:24px; max-width:560px; }
  .form-row{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .form-row label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); }
  .form-row input, .form-row select, .form-row textarea{
    border:1px solid var(--sage-line); border-radius:10px; padding:11px 13px; font-size:14px; background:var(--rice); color:var(--ink); width:100%;
  }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus{ outline:2px solid var(--turmeric); outline-offset:1px; }
  .form-row textarea{ resize:vertical; min-height:80px; }
  .form-grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  @media (max-width:520px){ .form-grid2{ grid-template-columns:1fr; } }
  .radio-group{ display:flex; gap:10px; flex-wrap:wrap; }
  .radio-pill{ border:1.5px solid var(--sage-line); border-radius:10px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:7px; }
  .radio-pill.active{ border-color:var(--leaf); background:var(--sage); color:var(--leaf-2); }
  .stepper{ display:flex; gap:6px; margin-bottom:22px; }
  .step-dot{ flex:1; height:4px; border-radius:99px; background:var(--sage-line); }
  .step-dot.done{ background:var(--leaf); }

  /* ---------- QRIS ---------- */
  .qris-box{ background:var(--white); border:1.5px dashed var(--sage-line); border-radius:20px; padding:22px; text-align:center; margin-bottom:18px; }
  .qris-grid{ width:170px; height:170px; margin:0 auto 14px; border-radius:14px; overflow:hidden; border:6px solid var(--ink); display:grid; grid-template-columns:repeat(9,1fr); grid-template-rows:repeat(9,1fr); }
  .qris-total{ font-family:'Space Mono',monospace; font-size:22px; font-weight:700; color:var(--ink); }
  .qris-label{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

  /* ---------- Success ---------- */
  .success-screen{ max-width:480px; margin:40px auto; text-align:center; padding:20px; }
  .success-badge{ width:88px; height:88px; border-radius:50%; background:var(--sage); display:flex; align-items:center; justify-content:center; margin:0 auto 20px; }
  .success-badge svg{ width:42px; height:42px; color:var(--leaf); }
  .success-screen h2{ font-size:24px; margin:0 0 8px; }
  .success-screen p{ color:var(--ink-soft); font-size:14px; line-height:1.6; margin-bottom:26px; }

  /* ---------- Toast ---------- */
  #toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--rice); padding:13px 20px; border-radius:12px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:all .25s ease; z-index:200; display:flex; align-items:center; gap:8px; box-shadow:0 12px 30px rgba(0,0,0,.3); max-width:90vw; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Orders / notif ---------- */
  .order-group{ margin-bottom:26px; }
  .order-group h3{ font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); margin:0 0 10px; }
  .order-card{ background:var(--white); border:1px solid var(--sage-line); border-radius:16px; padding:14px 16px; display:flex; gap:14px; align-items:center; margin-bottom:10px; }
  .order-thumb{ width:52px; height:52px; border-radius:12px; background:var(--sage); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:22px; }
  .order-info{ flex:1; min-width:0; }
  .order-info .name{ font-weight:700; font-size:13.5px; }
  .order-info .meta{ font-size:11.5px; color:var(--ink-soft); }
  .status-pill{ font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:99px; white-space:nowrap; }
  .status-pill.selesai{ background:var(--sage); color:var(--leaf-2); }
  .status-pill.pickup{ background:#F0E4BE; color:#8A6A12; }
  .status-pill.nilai{ background:#F4DEDE; color:var(--sambal); }
  .status-pill.baru{ background:#F4DEDE; color:var(--sambal); }
  .status-pill.dikonfirmasi{ background:var(--sage); color:var(--leaf-2); }
  .status-pill.dikirim{ background:#F6E9CE; color:var(--turmeric-deep); }
  .rate-box{ background:var(--sage); border-radius:14px; padding:14px; margin-top:8px; }
  .stars{ display:flex; gap:6px; margin-bottom:10px; }
  .stars button{ background:none; border:none; font-size:26px; color:var(--sage-line); line-height:1; padding:0; }
  .stars button.filled{ color:var(--turmeric); }

  /* ---------- Cards / dashboard ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:24px; }
  @media (max-width:760px){ .stat-grid{ grid-template-columns:1fr 1fr; } }
  .stat-tray{ background:var(--leaf); color:var(--rice); border-radius:var(--radius-tray); padding:20px; position:relative; overflow:hidden; }
  .stat-tray.alt{ background:var(--white); color:var(--ink); border:1px solid var(--sage-line); }
  .stat-tray .stat-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.8px; opacity:.75; margin-bottom:8px; }
  .stat-tray .stat-value{ font-family:'Space Mono',monospace; font-size:30px; font-weight:600; }
  .stat-tray .stat-unit{ font-size:13px; font-weight:500; opacity:.7; margin-left:4px; }
  .panel{ background:var(--white); border:1px solid var(--sage-line); border-radius:20px; padding:22px; margin-bottom:20px; }
  .panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:10px; flex-wrap:wrap; }
  .panel-head h3{ margin:0; font-size:16px; }
  .chart-bars{ display:flex; align-items:flex-end; gap:10px; height:160px; padding-top:10px; }
  .chart-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; justify-content:flex-end; height:100%; }
  .chart-bar{ width:100%; max-width:34px; background:linear-gradient(180deg,var(--leaf-light),var(--leaf)); border-radius:6px 6px 2px 2px; }
  .chart-col .lbl{ font-size:10.5px; color:var(--ink-soft); }

  /* ---------- Laporan ESG: tambahan visual (donut, tabel, kartu ESG) ---------- */
  .report-grid{ display:grid; grid-template-columns:1.05fr 1fr; gap:20px; align-items:stretch; }
  @media (max-width:900px){ .report-grid{ grid-template-columns:1fr; } }
  .donut-wrap{ display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
  .donut{ width:136px; height:136px; border-radius:50%; position:relative; flex-shrink:0; }
  .donut-hole{ position:absolute; inset:20px; background:var(--white); border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .donut-hole .v{ font-family:'Space Mono',monospace; font-weight:700; font-size:17px; color:var(--ink); }
  .donut-hole .l{ font-size:9px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.5px; text-align:center; padding:0 6px; }
  .legend-list{ display:flex; flex-direction:column; gap:11px; flex:1; min-width:170px; }
  .legend-row{ display:flex; align-items:center; gap:9px; font-size:13px; }
  .legend-dot{ width:11px; height:11px; border-radius:3px; flex-shrink:0; }
  .legend-row .lname{ color:var(--ink-soft); }
  .legend-row .lv{ margin-left:auto; font-family:'Space Mono',monospace; font-weight:700; font-size:12.5px; color:var(--ink); }
  .data-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .data-table th{ text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); padding:9px 10px; border-bottom:2px solid var(--sage-line); }
  .data-table td{ padding:11px 10px; border-bottom:1px solid var(--sage-line); }
  .data-table tr:last-child td{ border-bottom:none; font-weight:700; background:var(--sage); }
  .data-table tr:last-child td:first-child{ border-radius:10px 0 0 10px; }
  .data-table tr:last-child td:last-child{ border-radius:0 10px 10px 0; }
  .data-table td.num, .data-table th.num{ font-family:'Space Mono',monospace; text-align:right; }
  .cat-dot{ display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:7px; }
  .esg-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:820px){ .esg-grid{ grid-template-columns:1fr; } }
  .esg-card{ background:var(--white); border:1px solid var(--sage-line); border-radius:18px; padding:18px; display:flex; flex-direction:column; }
  .esg-card .esg-tag{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--turmeric-deep); margin-bottom:6px; }
  .esg-card h4{ margin:0 0 6px; font-size:15px; }
  .esg-card .esg-desc{ font-size:12px; color:var(--ink-soft); line-height:1.55; margin-bottom:10px; }
  .esg-bar-track{ height:8px; background:var(--sage); border-radius:99px; overflow:hidden; margin:2px 0 10px; }
  .esg-bar-fill{ height:100%; border-radius:99px; background:var(--leaf); }
  .esg-bottom{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; gap:8px; }
  .esg-pct{ font-family:'Space Mono',monospace; font-weight:700; font-size:15px; }
  .esg-status{ font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:99px; white-space:nowrap; }
  .esg-status.ok{ background:var(--sage); color:var(--leaf-2); }
  .esg-status.progress{ background:#F0E4BE; color:#8A6A12; }
  .checklist-row{ display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--sage-line); font-size:13px; }
  .checklist-row:last-child{ border-bottom:none; }
  .checklist-row .cl-name{ flex:1; }
  .checklist-row .cl-note{ font-size:11px; color:var(--ink-soft); }
  .check-ic{ width:21px; height:21px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; color:#fff; font-weight:700; }
  .check-ic.ok{ background:var(--leaf); }
  .check-ic.pending{ background:var(--turmeric); color:var(--ink); }
  .esg-summary-strip{ display:flex; align-items:center; gap:12px; background:var(--leaf); color:var(--rice); border-radius:18px; padding:16px 20px; margin-bottom:20px; flex-wrap:wrap; }
  .esg-summary-strip .score{ font-family:'Space Mono',monospace; font-size:26px; font-weight:700; color:var(--turmeric); }
  .esg-summary-strip .txt{ font-size:12.5px; color:rgba(250,246,236,.82); line-height:1.5; flex:1; min-width:200px; }

  /* ---------- Product list rows (supplier) ---------- */
  .row-card{ background:var(--white); border:1px solid var(--sage-line); border-radius:16px; padding:13px 16px; display:flex; align-items:center; gap:14px; margin-bottom:10px; }
  .row-thumb{ width:48px; height:48px; border-radius:10px; background:var(--sage); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .row-info{ flex:1; min-width:0; }
  .row-info .name{ font-weight:700; font-size:13.5px; }
  .row-info .meta{ font-size:11.5px; color:var(--ink-soft); }
  .pill-status{ font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:99px; white-space:nowrap; }
  .pill-status.checking{ background:#F5EACB; color:var(--turmeric-deep); }
  .pill-status.active{ background:var(--sage); color:var(--leaf-2); }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty-state svg{ width:44px; height:44px; margin-bottom:12px; opacity:.5; }

  .fab{ position:fixed; right:32px; bottom:32px; background:var(--turmeric); color:var(--ink); border:none; width:56px; height:56px; border-radius:18px; box-shadow:0 14px 30px -10px rgba(227,162,60,.6); display:flex; align-items:center; justify-content:center; z-index:40; }
  .fab svg{ width:24px; height:24px; }
  @media (max-width:900px){ .fab{ bottom:88px; right:18px; } }

  @media (max-width:900px){
    .sidebar{ display:none; }
    .main{ padding:18px 16px 90px; }
    .bottom-nav{ display:block; }
    .topbar-mobile{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .topbar-mobile .brand{ margin:0; }
    .topbar-mobile .brand svg{ width:28px; height:28px; }
    .topbar-mobile .brand-name{ font-size:18px; color:var(--leaf); }
    .topbar-mobile .brand-tag{ color:var(--turmeric-deep); }
    .form-card{ max-width:none; }
  }

  /* ---------- Running text (ticker) di halaman login ---------- */
  .ticker-wrap{ width:100%; max-width:640px; overflow:hidden; margin:2px 0 30px; border-top:1px solid rgba(250,246,236,.2); border-bottom:1px solid rgba(250,246,236,.2); padding:9px 0; position:relative; z-index:2; }
  .ticker-track{ display:inline-flex; white-space:nowrap; font-size:13px; font-weight:600; letter-spacing:.15px; color:rgba(250,246,236,.9); animation:tickerScroll 32s linear infinite; }
  .ticker-track span{ padding:0 22px; }
  @keyframes tickerScroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }

  /* ---------- Chat (buyer <-> supplier & komunitas) ---------- */
  .chat-screen{ display:flex; flex-direction:column; background:var(--white); border:1px solid var(--sage-line); border-radius:20px; overflow:hidden; height:min(560px,65vh); }
  .chat-messages{ flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .chat-bubble{ max-width:78%; padding:10px 14px; border-radius:16px; font-size:13.5px; line-height:1.5; }
  .chat-bubble.theirs{ align-self:flex-start; background:var(--sage); color:var(--ink); border-bottom-left-radius:4px; }
  .chat-bubble.mine{ align-self:flex-end; background:var(--leaf); color:var(--rice); border-bottom-right-radius:4px; }
  .chat-author{ font-size:10.5px; font-weight:700; color:var(--leaf-2); margin-bottom:3px; text-transform:uppercase; letter-spacing:.4px; }
  .chat-time{ font-size:9.5px; opacity:.6; margin-top:4px; }
  .chat-input-bar{ display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--sage-line); background:var(--rice); }
  .chat-input-bar input{ flex:1; border:1px solid var(--sage-line); border-radius:99px; padding:10px 16px; font-size:13.5px; background:var(--white); }
  .chat-input-bar input:focus{ outline:2px solid var(--turmeric); outline-offset:1px; }
  .chat-input-bar button{ width:42px; height:42px; border-radius:50%; padding:0; flex-shrink:0; }
  .chat-header{ display:flex; align-items:center; gap:12px; background:var(--white); border:1px solid var(--sage-line); border-radius:16px; padding:12px 16px; margin-bottom:14px; }
  .chat-header .avatar{ width:42px; height:42px; border-radius:50%; background:var(--sage); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .chat-header .info{ flex:1; min-width:0; }
  .chat-header .info .nm{ font-weight:700; font-size:14px; }
  .chat-header .info .st{ font-size:11.5px; color:var(--leaf-2); display:flex; align-items:center; gap:5px; }
  .chat-header .info .st::before{ content:''; width:7px; height:7px; border-radius:50%; background:#3FAE5C; display:inline-block; }

  /* ---------- Komunitas ---------- */
  .community-card{ background:var(--white); border:1px solid var(--sage-line); border-radius:22px; padding:44px 28px; text-align:center; max-width:480px; margin:20px auto; }
  .community-icon{ width:64px; height:64px; border-radius:50%; background:var(--sage); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; color:var(--leaf); }
  .community-icon svg{ width:30px; height:30px; }
  .community-card h2{ font-size:19px; margin:0 0 10px; line-height:1.35; }
  .community-card p{ color:var(--ink-soft); font-size:13.5px; line-height:1.6; margin:0 0 22px; }

  /* ---------- Tracking pesanan (dikirim) ---------- */
  .track-map{ background:linear-gradient(160deg,#F6E9CE,var(--sage)); border-radius:20px; padding:20px; margin-bottom:18px; position:relative; overflow:hidden; }
  .track-map svg{ width:100%; height:auto; display:block; }
  .track-status-card{ background:var(--leaf); color:var(--rice); border-radius:16px; padding:16px 18px; display:flex; align-items:center; gap:14px; margin-bottom:20px; }
  .track-status-card .ic{ width:40px; height:40px; border-radius:50%; background:rgba(250,246,236,.16); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .track-status-card .ic svg{ width:20px; height:20px; }
  .track-status-card .tt{ font-weight:700; font-size:14.5px; margin-bottom:2px; }
  .track-status-card .ds{ font-size:12px; opacity:.85; }
  .track-steps{ display:flex; flex-direction:column; gap:0; }
  .track-step{ display:flex; gap:14px; position:relative; padding-bottom:26px; }
  .track-step:last-child{ padding-bottom:0; }
  .track-step .dot-wrap{ display:flex; flex-direction:column; align-items:center; }
  .track-step .dot{ width:16px; height:16px; border-radius:50%; background:var(--sage-line); border:3px solid var(--white); box-shadow:0 0 0 2px var(--sage-line); flex-shrink:0; }
  .track-step.done .dot{ background:var(--leaf); box-shadow:0 0 0 2px var(--leaf); }
  .track-step.current .dot{ background:var(--turmeric); box-shadow:0 0 0 4px #F0E4BE; animation:pulseDot 1.6s ease-in-out infinite; }
  @keyframes pulseDot{ 0%,100%{ box-shadow:0 0 0 4px #F0E4BE; } 50%{ box-shadow:0 0 0 8px #F0E4BE; } }
  .track-step .line{ width:2px; flex:1; background:var(--sage-line); margin-top:2px; }
  .track-step.done .line{ background:var(--leaf); }
  .track-step .tstitle{ font-weight:700; font-size:13.5px; }
  .track-step.current .tstitle{ color:var(--turmeric-deep); }
  .track-step .tsdesc{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

  /* ---------- Edit produk ---------- */
  .row-card.clickable{ cursor:pointer; transition:box-shadow .15s; }
  .row-card.clickable:hover{ box-shadow:0 4px 14px -6px rgba(14,27,51,.25); }

const rupiah = n => 'Rp' + n.toLocaleString('id-ID');
const fmtDT = iso => { const d=new Date(iso); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) + ' · ' + d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); };
const now = () => new Date('2026-08-22T15:00:00');
function freshness(iso){
  if(!iso) return null;
  const h = (new Date(iso) - now())/3600000;
  if(h <= 6) return 'urgent';
  if(h <= 24) return 'soon';
  return 'fresh';
}
function freshLabel(iso){
  const h = Math.max(0, Math.round((new Date(iso)-now())/3600000));
  if(h < 1) return 'Segera kedaluwarsa';
  if(h < 24) return `Kedaluwarsa ${h} jam lagi`;
  return `Kedaluwarsa ${Math.round(h/24)} hari lagi`;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = ICON.check.replace('viewBox','style="width:16px;height:16px;flex-shrink:0"viewBox') + `<span>${msg}</span>`;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 3200);
}

  if(!name || !wa || !address){ toast('Lengkapi data diri dan alamat dulu ya'); return; }
  state.checkoutData.name = name;
  state.checkoutData.wa = wa;
  state.checkoutData.address = address;
  state.checkoutData.date = document.getElementById('co-date').value;
  state.checkoutData.time = document.getElementById('co-time').value;
  state.checkoutStep = 3;
  render();
}

  if(state.checkoutStep>1){ state.checkoutStep--; render(); }

}
function confirmPayment(){
  const p = PRODUCTS.find(x=>x.id===state.productId);
  const newOrderId = uid('o');
  const initialStatus = state.checkoutData.method === 'antar' ? 'dikirim' : 'menunggu_pickup';
  ORDERS.unshift({
    id: newOrderId, productId: p.id, qty: state.checkoutData.qty, buyerName: state.checkoutData.name,
    status: initialStatus, rating:null, review:'', createdAt: new Date().toISOString()
  });
  MY_SALES.unshift({ id: uid('s'), productId: p.id, qty: state.checkoutData.qty, buyerName: state.checkoutData.name, status:'baru', createdAt: new Date().toISOString() });
  state.lastOrderId = newOrderId;
  CHATS[chatKey('order', newOrderId)] = [
    {from:'them', text:`Halo ${state.checkoutData.name || ''}, terima kasih sudah membayar pesanan "${p.name}" ya! Pesananmu langsung kami proses 🙏`}

function renderBuyerOrders(){

    return `<div class="order-group"><h3>${labels[key]}</h3>${groups[key].map(o=>renderOrderCard(o,pillClass[key])).join('')}</div>`;

  return `

function renderOrderCard(o, pillClass){

  const clickAttr = o.status==='menunggu_penilaian' ? `onclick="toggleRating('${o.id}')" style="cursor:pointer"`

  return `
  <div>
    <div class="order-card" ${clickAttr}>
      <div class="order-thumb">${p&&p.image?`<img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;border-radius:12px;">`:(p?p.emoji:'📦')}</div>

function openChat(kind, id, counterpartName){
  state.chatKind = kind;
  state.chatId = id;
  state.chatCounterpart = counterpartName;
  const key = chatKey(kind, id);
  if(!CHATS[key]){
    CHATS[key] = [{ from:'them', text:`Halo, ada yang bisa dibantu terkait pesanan ini?` }];
  }
  state.screen = 'chat';
  render();
}

function renderChatScreen(){
  const key = chatKey(state.chatKind, state.chatId);
  const msgs = CHATS[key] || [];
  const backTarget = state.chatKind==='sale' ? 'sales' : 'orders';
  return `
  <button class="back-link" onclick="goTo('${backTarget}')">${ICON.back} Kembali</button>
  <div class="chat-header">
    <div class="avatar">👤</div>
    <div class="info">
      <div class="nm">${state.chatCounterpart || 'Pengguna'}</div>
      <div class="st">Online</div>
    </div>
  </div>
  <div class="chat-screen">
    <div class="chat-messages" id="chat-messages">
      ${msgs.map(m=>`<div class="chat-bubble ${m.from==='me'?'mine':'theirs'}">${m.text}</div>`).join('')}
    </div>
    <div class="chat-input-bar">
      <input id="chat-input" type="text" placeholder="Tulis pesan..." onkeydown="if(event.key==='Enter')sendChatMessage()">
      <button onclick="sendChatMessage()" aria-label="Kirim">${ICON.send}</button>
    </div>
  </div>`;
}

function sendChatMessage(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text) return;
  const key = chatKey(state.chatKind, state.chatId);
  CHATS[key].push({ from:'me', text });
  input.value = '';
  render();
  const capturedKey = key, capturedKind = state.chatKind, capturedId = state.chatId;
  setTimeout(()=>{
    CHATS[capturedKey].push({ from:'them', text: CANNED_REPLIES[Math.floor(Math.random()*CANNED_REPLIES.length)] });
    if(state.screen==='chat' && state.chatKind===capturedKind && state.chatId===capturedId) render();
  }, 1100);
}

  }
  return `

      ${COMMUNITY_MESSAGES.map(m=>`<div class="chat-bubble ${m.mine?'mine':'theirs'}">${!m.mine?`<div class="chat-author">${m.author}</div>`:''}${m.text}</div>`).join('')}
    </div>
    <div class="chat-input-bar">

}
function joinCommunity(){ state.communityJoined = true; render(); }
function sendCommunityMessage(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text) return;
  COMMUNITY_MESSAGES.push({ mine:true, text });
  input.value = '';
  render();
  setTimeout(()=>{
    const pool = COMMUNITY_MESSAGES.filter(m=>!m.mine);
    const author = pool.length ? pool[Math.floor(Math.random()*pool.length)].author : 'Anggota Komunitas';
    const replies = ['Setuju banget!','Wah keren, boleh sharing caranya?','Mantap, semangat terus 💪','Izin nyimak ya, bermanfaat nih.','Aku juga baru mulai, makasih infonya!'];
    COMMUNITY_MESSAGES.push({ author, text: replies[Math.floor(Math.random()*replies.length)], mine:false });
    if(state.screen==='community') render();
  }, 1200);
}

function submitNewProduct(){
  const name = document.getElementById('np-name').value.trim();
  const price = document.getElementById('np-price').value;
  if(!name || !price){ toast('Isi minimal nama dan harga produk'); return; }
  const expDate = document.getElementById('np-exp-date').value;
  const expTime = document.getElementById('np-exp-time').value;
  const newProduct = {
    id: uid('p'), cat: state.newProdCat==='n'?'n':'k', name, emoji: state.newProdCat==='n'?'♻️':'🍽️',
    price: parseInt(price)||0, stock: parseInt(document.getElementById('np-stock').value)||0,
    loc:'—', supplier:'Akunmu', keyword: document.getElementById('np-keyword').value,
    desc: document.getElementById('np-desc').value, exp: (state.newProdCat!=='n' && expDate) ? `${expDate}T${expTime||'12:00'}` : null,
    image:'', owner:true, pending:true
  };
  PRODUCTS.unshift(newProduct);
  toast('Selamat, kamu sudah berkontribusi dalam ketahanan pangan dan keberlanjutan bumi 🌱 Produk sedang diperiksa otomatis (±1 menit).');
  state.newProdCat = 'k';
  goTo('products');
  setTimeout(()=>{
    newProduct.pending = false;
    toast(`Produk "${newProduct.name}" sekarang aktif & tampil di Beranda pembeli 🎉`);
    if(state.screen==='products' || state.screen==='home') render();
  }, 60000);
}

function renderSupplierSales(){
  return `
  <div class="page-head"><div><div class="eyebrow">Penjualan</div><h1>Penjualan Saya</h1></div></div>
  ${MY_SALES.map(s=>{
    const p = PRODUCTS.find(x=>x.id===s.productId) || {name:'Produk',emoji:'📦'};
    const pillClass = s.status==='baru'?'baru':s.status==='dikonfirmasi'?'dikonfirmasi':'selesai';
    const pillLabel = s.status==='baru'?'Pesanan Baru':s.status==='dikonfirmasi'?'Dikonfirmasi':'Selesai';
    return `
    <div class="order-card">
      <div class="order-thumb">${p.image?`<img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;border-radius:12px;">`:p.emoji}</div>
      <div class="order-info">
        <div class="name">${p.name} · ${s.qty}x</div>
        <div class="meta">Pembeli: ${s.buyerName} · ${fmtDT(s.createdAt)}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
        ${s.status==='baru'
          ? `<button class="btn btn-turmeric" style="padding:8px 12px;font-size:12px;" onclick="confirmSale('${s.id}')">Konfirmasi</button>`
          : `<span class="status-pill ${pillClass}">${pillLabel}</span>`}
        <button class="btn btn-ghost" style="padding:5px 10px;font-size:11px;" onclick="openChat('sale','${s.id}','${s.buyerName}')">${ICON.chat} Chat</button>
      </div>
    </div>`;
  }).join('')}
  `;
}
function confirmSale(id){
  const s = MY_SALES.find(x=>x.id===id);
  s.status = 'dikonfirmasi';
  toast('Pesanan dikonfirmasi');
  render();
}

function donutGradient(segments){
  let acc=0; const stops=[];
  segments.forEach(s=>{ const start=acc; acc+=s.value; stops.push(`${s.color} ${start}% ${acc}%`); });
  return `conic-gradient(${stops.join(',')})`;
}
